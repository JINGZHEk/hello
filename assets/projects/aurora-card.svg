    <rect x="60" y="282" width="6" height="70" rx="3" fill="#AFA9EC"/>
    <text x="92" y="310" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">前端交互层</text>
    <text x="92" y="332" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="12" fill="#8FB8E0">自然语言交互的全息指挥大屏　免翻进度条，秒级寻人寻物；端侧硬脱敏，数据可用不可见</text>
    <text x="1120" y="317" text-anchor="end" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" font-weight="500" fill="#C6C1F5">零样本配置规则</text>
  </g>

  <g>
    <rect x="60" y="372" width="250" height="38" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.5"/>
    <text x="185" y="391" text-anchor="middle" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#B9D4F2">节省 90%+ 存储与算力</text>
  </g>
  <g>
    <rect x="330" y="372" width="250" height="38" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.5"/>
    <text x="455" y="391" text-anchor="middle" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#B9D4F2">误报率压降 900 倍</text>
  </g>
  <g>
    <rect x="600" y="372" width="250" height="38" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.5"/>
    <text x="725" y="391" text-anchor="middle" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#B9D4F2">单台硬件 1299 元</text>
  </g>
  <g>
    <rect x="870" y="372" width="250" height="38" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.5"/>
    <text x="995" y="391" text-anchor="middle" dominant-baseline="central" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="13" fill="#B9D4F2">SaaS 399 元 / 路 / 年</text>
